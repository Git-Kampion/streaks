<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixture Analysis Summary</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f8f9fa;
        color: #212529;
        margin: 20px;
        padding: 0;
    }
    h1, h2 {
        text-align: center;
        margin-bottom: 10px;
    }
    .summary-table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 12px;
    }
    .summary-table th, .summary-table td {
        border: 1px solid #dee2e6;
        padding: 4px 6px;
        text-align: center;
    }
    .summary-table th {
        background-color: #007bff;
        color: white;
    }
    .summary-table tr:nth-child(even) {
        background-color: #f2f2f2;
    }
    .table-wrapper {
        overflow-x: auto;
        box-shadow: 0 0 8px rgba(0,0,0,0.1);
        border-radius: 8px;
        background-color: white;
        padding: 10px;
    }
</style>
</head>
<body>

<h1>Fixture Analysis Summary</h1>

<div class='table-wrapper'>
<h2>All Rounds Summary</h2>
<table border="1" class="dataframe table table-sm table-striped table-bordered summary-table small-table">
  <thead>
    <tr style="text-align: right;">
      <th>Round</th>
      <th>SecHwin</th>
      <th>SecAwin</th>
      <th>SecDraw</th>
      <th>H1Hwin</th>
      <th>H1Awin</th>
      <th>H1Draw</th>
      <th>FullHWin</th>
      <th>FullDC</th>
      <th>FullOver1</th>
      <th>FullOver2</th>
      <th>FullBTS</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>1</td>
      <td>0</td>
      <td>1</td>
      <td>1</td>
      <td>1</td>
      <td>1</td>
      <td>0</td>
      <td>1</td>
      <td>2</td>
      <td>2</td>
      <td>2</td>
      <td>1</td>
    </tr>
    <tr>
      <td>2</td>
      <td>1</td>
      <td>0</td>
      <td>1</td>
      <td>1</td>
      <td>0</td>
      <td>1</td>
      <td>1</td>
      <td>1</td>
      <td>2</td>
      <td>1</td>
      <td>1</td>
    </tr>
  </tbody>
</table>
</div>

</body>
</html>
