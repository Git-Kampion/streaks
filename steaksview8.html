<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football Stats Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .fixture-container {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }

        .fixture-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .team-name {
            font-weight: bold;
            min-width: 200px;
            text-align: center;
        }

        .vs {
            font-size: 24px;
            color: #666;
        }

        .stats-container {
            display: flex;
            gap: 20px;
        }

        .stats-box {
            flex: 1;
        }

        .stats-title {
            background-color: #f5f5f5;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px 4px 0 0;
        }

        .stats-table-container {
            border: 1px solid #ddd;
            border-radius: 0 0 4px 4px;
            overflow: hidden;
        }

        .scrollable-table {
            max-height: 185px; /* Height for 5 rows */
            overflow-y: auto;
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        #datePicker {
            padding: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .no-fixtures {
            color: #666;
            font-style: italic;
        }

        .search-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #teamSearch {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .scroll-hint {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Football Team Statistics</h1>
    <input type="date" id="datePicker">

    <div class="search-container">
        <input type="text" id="teamSearch" placeholder="Search for a team...">
        <button id="searchBtn">Search</button>
        <button id="clearSearch">Clear</button>
    </div>

    <div id="fixtureList">
        <p class="no-fixtures">No date selected</p>
    </div>

    <script>// Global variables
        let fixtures = [];
        let homeStats = [];
        let awayStats = [];
        let allTeams = new Set();

        // Priority stats to show first (first 5 will be visible without scrolling)
        const priorityStats = [
            'GamesPlayed',
            'HomeOverZ',
            'AwayOverZ'
        ];

        // Load data with enhanced team matching
        async function loadData() {
            try {
                // Load all data files
                const [fixturesRes, homeRes, awayRes] = await Promise.all([
                    fetch('fixtures.json'),
                    fetch('home_stats.json'),
                    fetch('away_stats.json')
                ]);

                fixtures = await fixturesRes.json();
                homeStats = await homeRes.json();
                awayStats = await awayRes.json();

                // Create a set of all team names for search
                fixtures.forEach(fixture => {
                    allTeams.add(fixture.home);
                    allTeams.add(fixture.away);
                });

                console.log('Data loaded successfully');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('fixtureList').innerHTML =
                    '<p class="error">Error loading data. Please check console.</p>';
            }
        }

        // Case-insensitive team name matcher
        function findTeamStats(teamName, statsArray) {
            return statsArray.find(team =>
                team.Team.toLowerCase() === teamName.toLowerCase()
            );
        }

        // Generate scrollable stats table with priority stats first
        function generateStatsTable(teamStat, type) {
            if (!teamStat) {
                return `<div class="no-data">No ${type} stats available</div>`;
            }

            // Create rows for priority stats (shown first)
            let priorityRows = '';
            priorityStats.forEach(key => {
                if (teamStat[key] !== undefined) {
                    const formattedKey = key
                        .replace(/([A-Z])/g, ' $1')
                        .replace(/^home /i, '')
                        .replace(/^away /i, '')
                        .trim();

                    priorityRows += `
                        <tr>
                            <td>${formattedKey}</td>
                            <td>${teamStat[key] !== undefined ? teamStat[key] : 'N/A'}</td>
                        </tr>
                    `;
                }
            });

            // Create rows for other stats
            let otherRows = '';
            for (const [key, value] of Object.entries(teamStat)) {
                if (key === 'Team' || priorityStats.includes(key)) continue;

                const formattedKey = key
                    .replace(/([A-Z])/g, ' $1')
                    .replace(/^home /i, '')
                    .replace(/^away /i, '')
                    .trim();

                otherRows += `
                    <tr>
                        <td>${formattedKey}</td>
                        <td>${value !== undefined ? value : 'N/A'}</td>
                    </tr>
                `;
            }

            return `
                <div class="stats-table-container">
                    <div class="scrollable-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Statistic</th>
                                    <th>Value</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Team</strong></td>
                                    <td><strong>${teamStat.Team}</strong></td>
                                </tr>
                                ${priorityRows}
                                ${otherRows}
                            </tbody>
                        </table>
                    </div>
                    <div class="scroll-hint">Scroll to see more stats</div>
                </div>
            `;
        }

        // Display fixtures with optional team filter
        function displayFixtures(date, teamFilter = '') {
            const fixtureList = document.getElementById('fixtureList');

            // Filter fixtures by date
            let filteredFixtures = fixtures.filter(f => f.date === date);

            // Apply team filter if provided
            if (teamFilter) {
                const searchTerm = teamFilter.toLowerCase();
                filteredFixtures = filteredFixtures.filter(f =>
                    f.home.toLowerCase().includes(searchTerm) ||
                    f.away.toLowerCase().includes(searchTerm)
                );
            }

            if (filteredFixtures.length === 0) {
                const message = teamFilter
                    ? `No fixtures found for ${date} matching "${teamFilter}"`
                    : `No fixtures found for ${date}`;
                fixtureList.innerHTML = `<p class="no-fixtures">${message}</p>`;
                return;
            }

            let html = '';
            filteredFixtures.forEach(fixture => {
                const homeTeam = findTeamStats(fixture.home, homeStats);
                const awayTeam = findTeamStats(fixture.away, awayStats);

                html += `
                    <div class="fixture-container">
                        <div class="fixture-header">
                            <div class="team-name">${fixture.home}</div>
                            <div class="vs">vs</div>
                            <div class="team-name">${fixture.away}</div>
                        </div>
                        <div class="stats-container">
                            <div class="stats-box">
                                <div class="stats-title">Home Team Stats</div>
                                ${generateStatsTable(homeTeam, 'home')}
                            </div>
                            <div class="stats-box">
                                <div class="stats-title">Away Team Stats</div>
                                ${generateStatsTable(awayTeam, 'away')}
                            </div>
                        </div>
                    </div>
                `;
            });

            fixtureList.innerHTML = html;
        }

        // Event listeners
        document.getElementById('datePicker').addEventListener('change', function() {
            const selectedDate = this.value;
            if (!selectedDate) return;
            displayFixtures(selectedDate);
        });

        document.getElementById('searchBtn').addEventListener('click', function() {
            const searchTerm = document.getElementById('teamSearch').value.trim();
            const selectedDate = document.getElementById('datePicker').value;
            if (!selectedDate) {
                alert('Please select a date first');
                return;
            }
            displayFixtures(selectedDate, searchTerm);
        });

        document.getElementById('clearSearch').addEventListener('click', function() {
            document.getElementById('teamSearch').value = '';
            const selectedDate = document.getElementById('datePicker').value;
            if (selectedDate) {
                displayFixtures(selectedDate);
            }
        });

        // Initialize
        window.addEventListener('load', async () => {
            await loadData();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;
            document.getElementById('datePicker').dispatchEvent(new Event('change'));
        });</script>
</body>
</html>
