<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreaksAway Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f4f4f4;
        }

        select {
            margin-right: 10px;
        }

        .hot-streaks-button {
            background-color: #ff5733;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

            .hot-streaks-button:hover {
                background-color: #e34e2d;
            }
    </style>
</head>
<body>
    <h2>Team Statistics</h2>
    <button class="hot-streaks-button" onclick="filterHotStreaks()">HotStreaks</button>
    <label for="columnSelect">Select column to display:</label>
    <select id="columnSelect"></select>

    <table id="dataTable">
        <thead>
            <tr>
                <th>Team</th>
                <th>GamesPlayed</th>
                <th id="extraHeader"></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <input type="file" id="upload" accept=".xlsx, .xls" />

    <script>
        const columnSelect = document.getElementById("columnSelect");
        const tableBody = document.getElementById("tableBody");
        const extraHeader = document.getElementById("extraHeader");
        let fullData = [];

        document.getElementById("upload").addEventListener("change", handleFile, false);

        function handleFile(event) {
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(sheet);

                fullData = json;
                populateDropdownAndRender(json);
            };

            reader.readAsArrayBuffer(file);
        }

        function populateDropdownAndRender(data) {
            columnSelect.innerHTML = "";
            const extraColumns = Object.keys(data[0]).filter(col => col !== "Team" && col !== "GamesPlayed");

            extraColumns.forEach(col => {
                const option = document.createElement("option");
                option.value = col;
                option.textContent = col;
                columnSelect.appendChild(option);
            });

            columnSelect.addEventListener("change", () => renderTable(data, columnSelect.value));

            // Default column is AwayOverZ
            const defaultColumn = "AwayOverZ";
            columnSelect.value = defaultColumn;
            renderTable(data, defaultColumn);
        }

        function renderTable(data, selectedCol) {
            tableBody.innerHTML = "";
            extraHeader.textContent = selectedCol || "";

            data.forEach(row => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
              <td>${row.Team || ""}</td>
              <td>${row.GamesPlayed || ""}</td>
              <td>${selectedCol ? row[selectedCol] || "" : ""}</td>
            `;
                tableBody.appendChild(tr);
            });
        }

        function filterHotStreaks() {
            const selectedCol = columnSelect.value;
            const filtered = fullData.filter(row => row[selectedCol] === "R17/T0");

            columnSelect.value = selectedCol;
            renderTable(filtered, selectedCol);
        }
    </script>
</body>
</html>
