<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football Stats Viewer with Team Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #teamSearch {
            padding: 8px;
            font-size: 16px;
            flex-grow: 1;
        }

        #searchButton {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            #searchButton:hover {
                background-color: #45a049;
            }

        .fixture-container {
            margin-bottom: 30px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
        }

        .fixture-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .team-name {
            font-weight: bold;
            min-width: 200px;
            text-align: center;
        }

        .vs {
            font-size: 24px;
            color: #666;
        }

        .stats-container {
            display: flex;
            gap: 20px;
        }

        .stats-box {
            flex: 1;
        }

        .stats-title {
            background-color: #f5f5f5;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px 4px 0 0;
        }

        .stats-table-container {
            border: 1px solid #ddd;
            border-radius: 0 0 4px 4px;
            overflow: hidden;
        }

        .compact-table-wrapper {
            max-height: 205px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        #datePicker {
            padding: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .no-fixtures, .no-results {
            color: #666;
            font-style: italic;
        }

        .search-info {
            margin-bottom: 10px;
            font-style: italic;
            color: #666;
        }

        .clear-search {
            color: #0066cc;
            text-decoration: underline;
            cursor: pointer;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .stats-container {
                flex-direction: column;
            }

            .team-name {
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <h1>Football Team Statistics</h1>

    <div id="dateView">
        <input type="date" id="datePicker">

        <div class="search-container">
            <input type="text" id="teamSearch" placeholder="Search for a team within selected date...">
            <button id="searchButton">Search</button>
        </div>

        <div id="searchInfo" class="search-info" style="display: none;">
            Showing results for: <span id="currentSearchTerm"></span>
            <span class="clear-search" id="clearSearch">Clear search</span>
        </div>

        <div id="fixtureList">
            <p class="no-fixtures">No date selected</p>
        </div>
    </div>

    <script>
        // Global variables
        let fixtures = [];
        let homeStats = [];
        let awayStats = [];
        let currentDateFixtures = [];
        let currentSearchTerm = '';

        // Priority stats to show first
        const priorityStats = [
            'team',
            'gamesPlayed',
            'homeOver0.5',
            'homeOver1.5',
            'homeOver2.5',
            'homeOver3.5',
            'homeOver4.5',
            'homeOver5.5',
            'awayOver0.5',
            'awayOver1.5',
            'awayOver2.5',
            'awayOver3.5',
            'awayOver4.5',
            'awayOver5.5'
        ];

        // Load data
        async function loadData() {
            try {
                const [fixturesRes, homeRes, awayRes] = await Promise.all([
                    fetch('fixtures.json'),
                    fetch('home_stats.json'),
                    fetch('away_stats.json')
                ]);

                fixtures = await fixturesRes.json();
                homeStats = await homeRes.json();
                awayStats = await awayRes.json();

                console.log('Data loaded successfully');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('fixtureList').innerHTML =
                    '<p class="error">Error loading data. Please check console.</p>';
            }
        }

        // Generate compact stats table
        function generateCompactStatsTable(teamStat) {
            if (!teamStat) {
                return '<div class="no-data">No stats available</div>';
            }

            // Create table rows for priority stats
            let priorityRows = '';
            priorityStats.forEach(key => {
                if (teamStat[key] !== undefined) {
                    const formattedKey = key
                        .replace(/([A-Z])/g, ' $1')
                        .replace(/^home /i, '')
                        .replace(/^away /i, '')
                        .trim();

                    priorityRows += `
                            <tr>
                                <td>${formattedKey}</td>
                                <td>${teamStat[key]}</td>
                            </tr>
                        `;
                }
            });

            // Create table rows for other stats
            let otherRows = '';
            for (const [key, value] of Object.entries(teamStat)) {
                if (priorityStats.includes(key)) continue;

                const formattedKey = key
                    .replace(/([A-Z])/g, ' $1')
                    .replace(/^home /i, '')
                    .replace(/^away /i, '')
                    .trim();

                otherRows += `
                        <tr>
                            <td>${formattedKey}</td>
                            <td>${value}</td>
                        </tr>
                    `;
            }

            return `
                    <div class="stats-table-container">
                        <div class="compact-table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Statistic</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${priorityRows}
                                    ${otherRows}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
        }

        // Display fixtures for selected date and optional team filter
        function displayFixtures(date, teamFilter = '') {
            const fixtureList = document.getElementById('fixtureList');

            // Filter fixtures by date
            currentDateFixtures = fixtures.filter(f => f.date === date);

            // Apply team filter if provided
            let filteredFixtures = currentDateFixtures;
            if (teamFilter) {
                const searchTerm = teamFilter.toLowerCase();
                filteredFixtures = currentDateFixtures.filter(f =>
                    f.home.toLowerCase().includes(searchTerm) ||
                    f.away.toLowerCase().includes(searchTerm)
                );
            }

            if (filteredFixtures.length === 0) {
                const message = teamFilter
                    ? `No fixtures found for ${date} matching "${teamFilter}"`
                    : `No fixtures found for ${date}`;
                fixtureList.innerHTML = `<p class="no-fixtures">${message}</p>`;
                return;
            }

            let html = '';
            filteredFixtures.forEach(fixture => {
                const homeTeam = homeStats.find(team => team.team === fixture.home);
                const awayTeam = awayStats.find(team => team.team === fixture.away);

                html += `
                        <div class="fixture-container">
                            <div class="fixture-header">
                                <div class="team-name">${fixture.home}</div>
                                <div class="vs">vs</div>
                                <div class="team-name">${fixture.away}</div>
                            </div>
                            <div class="stats-container">
                                <div class="stats-box">
                                    <div class="stats-title">Home Team Stats</div>
                                    ${generateCompactStatsTable(homeTeam)}
                                </div>
                                <div class="stats-box">
                                    <div class="stats-title">Away Team Stats</div>
                                    ${generateCompactStatsTable(awayTeam)}
                                </div>
                            </div>
                        </div>
                    `;
            });

            fixtureList.innerHTML = html;
        }

        // Handle date selection
        document.getElementById('datePicker').addEventListener('change', function () {
            const selectedDate = this.value;

            if (!selectedDate) {
                document.getElementById('fixtureList').innerHTML = '<p class="no-fixtures">No date selected</p>';
                document.getElementById('searchInfo').style.display = 'none';
                return;
            }

            // Reset search when date changes
            currentSearchTerm = '';
            document.getElementById('teamSearch').value = '';
            document.getElementById('searchInfo').style.display = 'none';

            displayFixtures(selectedDate);
        });

        // Handle team search within date
        function handleTeamSearch() {
            const searchTerm = document.getElementById('teamSearch').value.trim();
            const selectedDate = document.getElementById('datePicker').value;

            if (!selectedDate) {
                alert('Please select a date first');
                return;
            }

            if (!searchTerm) {
                // If search term is empty, show all fixtures for the date
                currentSearchTerm = '';
                document.getElementById('searchInfo').style.display = 'none';
                displayFixtures(selectedDate);
                return;
            }

            currentSearchTerm = searchTerm;
            document.getElementById('currentSearchTerm').textContent = searchTerm;
            document.getElementById('searchInfo').style.display = 'block';

            displayFixtures(selectedDate, searchTerm);
        }

        // Search button click handler
        document.getElementById('searchButton').addEventListener('click', handleTeamSearch);

        // Search on Enter key
        document.getElementById('teamSearch').addEventListener('keyup', function (e) {
            if (e.key === 'Enter') {
                handleTeamSearch();
            }
        });

        // Clear search handler
        document.getElementById('clearSearch').addEventListener('click', function () {
            document.getElementById('teamSearch').value = '';
            currentSearchTerm = '';
            document.getElementById('searchInfo').style.display = 'none';

            const selectedDate = document.getElementById('datePicker').value;
            if (selectedDate) {
                displayFixtures(selectedDate);
            }
        });

        // Initialize
        loadData();

        // Set default date to today
        window.addEventListener('load', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;
            document.getElementById('datePicker').dispatchEvent(new Event('change'));
        });
    </script>
</body>
</html>
