<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreaksAway Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            gap: 20px;
        }
        .section {
            width: 50%;
            
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            width:30%
        }

        th {
            background-color: #f4f4f4;
        }

        select, input[type="text"] {
            margin-right: 10px;
            padding: 5px;
        }

        .hot-streaks-button {
            background-color: #ff5733;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

            .hot-streaks-button:hover {
                background-color: #e34e2d;
            }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="section">
        <h2>Section 1 - Team Statistics</h2>
        <input type="file" id="upload" accept=".xlsx, .xls" />
        <br><br>
        <input type="text" id="searchInput1" placeholder="Search Team" oninput="applySearchFilter('1')" />
        <input type="text" id="filterInput" placeholder="Enter filter value (e.g. /T1)" />
        <button class="hot-streaks-button" onclick="applyCustomFilter()">HotStreaks</button>
        <label for="columnSelect" id="columnLabel">Select column to display:</label>
        <label id="lblInp" style="color:black"></label>
        <select id="columnSelect"></select>

        <table id="dataTable">
            <thead>
                <tr>
                    <th>Team</th>
                    <th>GamesPlayed</th>
                    <th id="extraHeader"></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div class="section">
        <h2>Section 2 - Team Statistics</h2>
        <input type="file" id="upload2" accept=".xlsx, .xls" />
        <br><br>
        <input type="text" id="searchInput2" placeholder="Search Team" oninput="applySearchFilter2('2')" />
        <input type="text" id="filterInput2" placeholder="Enter filter value (e.g. /T1)" />
        <button class="hot-streaks-button" onclick="applyCustomFilter2()">HotStreaks</button>
        <label for="columnSelect2" id="columnLabel2">Select column to display:</label>
        <label id="lblInp2" style="color:black"></label>
        <select id="columnSelect2"></select>

        <table id="dataTable2">
            <thead>
                <tr>
                    <th>Team</th>
                    <th>GamesPlayed</th>
                    <th id="extraHeader2"></th>
                </tr>
            </thead>
            <tbody id="tableBody2"></tbody>
        </table>
    </div>
    <script src="xlsx.full.min.js"></script>

    <script>
        const columnSelect = document.getElementById("columnSelect");
        const columnLabel = document.getElementById("columnLabel");
        const tableBody = document.getElementById("tableBody");
        const extraHeader = document.getElementById("extraHeader");
        const filterInput = document.getElementById("filterInput");
        const hhh = document.getElementById("lblInp");

        const columnSelect2 = document.getElementById("columnSelect2");
        const columnLabel2 = document.getElementById("columnLabel2");
        const tableBody2 = document.getElementById("tableBody2");
        const extraHeader2 = document.getElementById("extraHeader2");
        const filterInput2 = document.getElementById("filterInput2");
        const hhh2 = document.getElementById("lblInp2");
        let currentData = [];
        let currentData2 = [];
        let fullData = [];
        let fullData2 = [];

        document.getElementById("upload").addEventListener("change", handleFile, false);
        document.getElementById("upload2").addEventListener("change", handleFile2, false);

        function handleFile(event) {
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(sheet);

                fullData = json;
                populateDropdownAndRender(json);
            };

            reader.readAsArrayBuffer(file);
        }
        function handleFile2(event) {
            const file = event.target.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(sheet);

                fullData2 = json;
                populateDropdownAndRender2(json);
            };

            reader.readAsArrayBuffer(file);
        }

        function populateDropdownAndRender2(data) {
            columnSelect2.innerHTML = "";
            const extraColumns = Object.keys(data[0]).filter(col => col !== "Team" && col !== "GamesPlayed");

            extraColumns.forEach(col => {
                const option = document.createElement("option");
                option.value = col;
                option.textContent = col;
                columnSelect2.appendChild(option);
            });

            columnSelect2.addEventListener("change", () => {
                const selectedCol = columnSelect2.value;
                renderTable2(data, selectedCol);
            });

            const defaultColumn = "AwayOverZ";
            if (extraColumns.includes(defaultColumn)) {
                columnSelect2.value = defaultColumn;
                renderTable2(data, defaultColumn);
            }
            currentData2 = data;
        }
        function populateDropdownAndRender(data) {
            columnSelect.innerHTML = "";
            const extraColumns = Object.keys(data[0]).filter(col => col !== "Team" && col !== "GamesPlayed");

            extraColumns.forEach(col => {
                const option = document.createElement("option");
                option.value = col;
                option.textContent = col;
                columnSelect.appendChild(option);
            });

            columnSelect.addEventListener("change", () => {
                const selectedCol = columnSelect.value;
                renderTable(data, selectedCol);
            });

            const defaultColumn = "AwayOverZ";
            if (extraColumns.includes(defaultColumn)) {
                columnSelect.value = defaultColumn;
                renderTable(data, defaultColumn);
            }
            currentData = data;
        }

        function renderTable(data, selectedCol) {
            tableBody.innerHTML = "";
            extraHeader.textContent = selectedCol || "";

            data.forEach(row => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                          <td>${row.Team || ""}</td>
                          <td>${row.GamesPlayed || ""}</td>
                          <td>${selectedCol ? row[selectedCol] || "" : ""}</td>
                        `;
                tableBody.appendChild(tr);
            });
        }
        function renderTable2(data, selectedCol) {
            tableBody2.innerHTML = "";
            extraHeader2.textContent = selectedCol || "";

            data.forEach(row => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                  <td>${row.Team || ""}</td>
                  <td>${row.GamesPlayed || ""}</td>
                  <td>${selectedCol ? row[selectedCol] || "" : ""}</td>
                `;
                tableBody2.appendChild(tr);
            });
        }

        function applyCustomFilter() {
            const selectedCol = columnSelect.value;
            hhh.innerHTML = filterInput.value.split("+")[0];
            const inputs = filterInput.value.split("+");

            //const inputs = ["/R0", "/R1"];
            const filtered = fullData.filter(row => {
                const value = row[selectedCol];

                if (typeof value !== "string") return false;

                return inputs.some(input => {
                    // Ensure it ends exactly with /R0 or /R1 and nothing after it
                    const index = value.lastIndexOf(input);
                    //return index !== -1 && index + input.length === value.length; .replace("/", "")
                    const endsWithExact = index !== -1 && index + input.length === value.length;

                    // Check if value starts exactly with input (e.g. R1/)
                    const startsWithExact = value.startsWith(input );

                    return endsWithExact || startsWithExact;

                });
            });
            
            renderTable(filtered, selectedCol);
            currentData = filtered;
        }
        function applyCustomFilter2() {
            const selectedCol = columnSelect2.value;
            hhh2.innerHTML = filterInput2.value.split("+")[0];
            const inputs = filterInput2.value.split("+");

            //const inputs = ["/R0", "/R1"];
            const filtered = fullData2.filter(row => {
                const value = row[selectedCol];

                if (typeof value !== "string") return false;

                return inputs.some(input => {
                    // Ensure it ends exactly with /R0 or /R1 and nothing after it
                    const index = value.lastIndexOf(input);
                    //return index !== -1 && index + input.length === value.length;
                    const endsWithExact = index !== -1 && index + input.length === value.length;

                    // Check if value starts exactly with input (e.g. R1/)
                    const startsWithExact = value.startsWith(input );


                    return endsWithExact || startsWithExact;

                });
            });
            renderTable2(filtered, selectedCol);
            currentData2 = filtered;
        }
        function applySearchFilter(id) {
            const searhText = document.getElementById("searchInput1").value.toLowerCase();
            const selectedCol = columnSelect.value;

            const filtered = currentData.filter(row => row.Team && row.Team.toLowerCase().includes(searhText));
            renderTable(filtered, selectedCol);
        }
        function applySearchFilter2(id) {
            const searhText = document.getElementById("searchInput2").value.toLowerCase();
            const selectedCol = columnSelect2.value;

            const filtered = currentData2.filter(row => row.Team && row.Team.toLowerCase().includes(searhText));
            renderTable2(filtered, selectedCol);
        }
    </script>
</body>
</html>
