name: Run Scraper on Windows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  scrape:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install selenium pandas webdriver-manager

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: python importResV2git.py

      # ⬇️ Commit DB directly to repo instead of uploading artifact
      - name: Commit and push DB
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add football.sqlite
          git commit -m "Update football.sqlite from scraper run" || echo "No changes to commit"
          git push
